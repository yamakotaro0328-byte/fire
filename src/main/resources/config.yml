# ==========================================
#  HanabiFestival 全体設定
# ==========================================

# デフォルトで開催するショーの名前（shows.ymlのキー）
default-show: "random"

# 開始前カウントダウン秒数（0で即時開始）
countdown-seconds: 3

# 打ち上げ場所の優先順位: エリア(areas.yml) > 地点(points.yml) > プレイヤー周囲
# 地点・プレイヤー周囲を使う場合のランダム打ち上げ半径（ブロック）
fallback-radius: 20

# 各ショーで個別に指定がない場合に使われる花火の既定値
default:
  power: 1
  colors:
    - "FF0000"
    - "FF8C00"
    - "FFFF00"
    - "00FF00"
    - "00FFFF"
    - "0000FF"
    - "FF00FF"
    - "FFFFFF"
  # BALL(小玉) / BALL_LARGE(大玉) / STAR(星形) / BURST(破裂型) / CREEPER(クリーパー型)
  types:
    - "BALL"
    - "BALL_LARGE"
    - "STAR"
    - "BURST"
    - "CREEPER"
  flicker: true
  trail: true

# 開催中に定期的に歓声風のサウンドを鳴らす間隔（秒、0で無効）
cheer-interval-seconds: 15

# 打ち上げ地点の周辺に雰囲気演出の炎パーティクルを出すか（打ち上げ地点が登録されている場合のみ）
ambient-particles: true

# 開催中の天候・時間演出（対象ワールドは打ち上げ地点/観客がいるワールド）
stage-effects:
  # 開始時に夜（打ち上げ映えする時間帯）に固定し、終了後に元の時間へ戻す
  force-night: true
  # 開始時に雨・雷を止め、終了後に元の天候へ戻す
  force-clear-weather: true
