# ==========================================
#  HanabiFestival 全体設定
# ==========================================

# デフォルトで開催するショーの名前（shows.ymlのキー）
default-show: "random"

# 開始前カウントダウン秒数（0で即時開始）
countdown-seconds: 3

# 打ち上げ地点(points.yml)が1つも登録されていない場合に使用する
# プレイヤー中心のランダム打ち上げ半径（ブロック）
fallback-radius: 20

# 各ショーで個別に指定がない場合に使われる花火の既定値
default:
  power: 1
  colors:
    - "FF0000"
    - "FF8C00"
    - "FFFF00"
    - "00FF00"
    - "00FFFF"
    - "0000FF"
    - "FF00FF"
    - "FFFFFF"
  types:
    - "BALL"
    - "BALL_LARGE"
    - "STAR"
    - "BURST"
  flicker: true
  trail: true

# 開催中に定期的に歓声風のサウンドを鳴らす間隔（秒、0で無効）
cheer-interval-seconds: 15
